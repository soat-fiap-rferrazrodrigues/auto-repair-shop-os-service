# execution-service — DynamoDB + fila de execução.
# Role ARN: output `service_role_arns["execution-service"]` (stack messaging).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: execution-service
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/auto-repair-ENV-execution-service
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: execution-service-config
data:
  PORT: "3002"
  DD_SERVICE: execution-service
  DD_ENV: ENV
  AWS_REGION: us-east-1
  # output service_env["execution-service"] (stack messaging)
  DYNAMODB_TABLE: auto-repair-ENV-execution
  EXECUTION_SNS_TOPIC_ARN: arn:aws:sns:us-east-1:ACCOUNT_ID:auto-repair-ENV-execution-events
  EXECUTION_SQS_QUEUE_URL: https://sqs.us-east-1.amazonaws.com/ACCOUNT_ID/auto-repair-ENV-execution-commands
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: execution-service-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore # namespaced store from infra-k8s/k8s/external-secrets.yaml
  target:
    name: execution-service-secrets
  data:
    # Same HS256 secret the os-service already reads (ADR-001).
    - secretKey: JWT_SECRET
      remoteRef:
        key: auto-repair-ENV/api
        property: JWT_SECRET
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: execution-service
  labels:
    app: execution-service
    tags.datadoghq.com/service: execution-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: execution-service
  template:
    metadata:
      labels:
        app: execution-service
        tags.datadoghq.com/service: execution-service
    spec:
      serviceAccountName: execution-service
      terminationGracePeriodSeconds: 30
      containers:
        - name: execution
          image: ghcr.io/soat-fiap-rferrazrodrigues/auto-repair-execution-service:main
          ports:
            - containerPort: 3002
          envFrom:
            - configMapRef:
                name: execution-service-config
            - secretRef:
                name: execution-service-secrets
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 384Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 3002
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 3002
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: execution-service
spec:
  selector:
    app: execution-service
  ports:
    - port: 80
      targetPort: 3002
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: execution-service
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: execution-service
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
