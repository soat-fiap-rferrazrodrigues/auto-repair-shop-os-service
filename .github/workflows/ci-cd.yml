name: CI/CD - Application

on:
  push:
    branches: [main, homolog]
  pull_request:
    branches: [main, homolog]

permissions:
  contents: read
  packages: write
  id-token: write # required for AWS OIDC (no long-lived keys)

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  AWS_REGION: us-east-1

jobs:
  # ── Quality gate: runs on every PR and blocks the merge ────────────────────
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: auto_repair_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run build

      - name: Unit tests with coverage
        run: npm run test:cov
        env:
          DATABASE_HOST: localhost
          DATABASE_PORT: 5432
          DATABASE_USER: postgres
          DATABASE_PASSWORD: postgres
          DATABASE_NAME: auto_repair_test
          JWT_SECRET: test-secret

      - name: E2E tests
        run: npm run test:e2e
        env:
          DATABASE_HOST: localhost
          DATABASE_PORT: 5432
          DATABASE_USER: postgres
          DATABASE_PASSWORD: postgres
          DATABASE_NAME: auto_repair_test
          JWT_SECRET: test-secret

      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/

  # ── Image build: only after the quality gate, only on protected branches ───
  docker:
    name: Build & Push Image
    needs: build-and-test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=ref,event=branch

      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Homolog: automatic on every merge into the homolog branch ─────────────
  deploy-homolog:
    name: Deploy to Homolog
    needs: docker
    if: github.ref == 'refs/heads/homolog'
    runs-on: ubuntu-latest
    environment: homolog
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name auto-repair-homolog --region $AWS_REGION

      - name: Run database migrations
        run: |
          kubectl delete job db-migrate --ignore-not-found
          kubectl create job db-migrate \
            --image=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }} \
            -- npm run migration:run
          kubectl wait --for=condition=complete job/db-migrate --timeout=300s

      - name: Roll out new image
        run: |
          kubectl set image deployment/auto-repair-api \
            api=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          kubectl rollout status deployment/auto-repair-api --timeout=180s

      - name: Smoke test
        run: |
          kubectl run smoke --rm -i --restart=Never --image=curlimages/curl -- \
            curl -fsS http://auto-repair-api/health

  # ── Production: gated by a manual reviewer on the GitHub Environment ──────
  deploy-prod:
    name: Deploy to Production
    needs: docker
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name auto-repair-prod --region $AWS_REGION

      - name: Run database migrations
        run: |
          kubectl delete job db-migrate --ignore-not-found
          kubectl create job db-migrate \
            --image=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }} \
            -- npm run migration:run
          kubectl wait --for=condition=complete job/db-migrate --timeout=300s

      - name: Roll out new image
        run: |
          kubectl set image deployment/auto-repair-api \
            api=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          kubectl rollout status deployment/auto-repair-api --timeout=180s
