name: CI/CD - OS Service

on:
  push:
    branches: [main, homolog]
  pull_request:
    branches: [main, homolog]

permissions:
  contents: read
  packages: write
  id-token: write # required for AWS OIDC (no long-lived keys)

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  AWS_REGION: us-east-1
  DEPLOYMENT: auto-repair-api

jobs:
  # ── Quality gate: required check on the protected main branch ─────────────
  build-and-test:
    name: Build, Test & Quality
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: auto_repair_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      DATABASE_HOST: localhost
      DATABASE_PORT: 5432
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_NAME: auto_repair_test
      JWT_SECRET: test-secret
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Sonar needs full history for new-code detection

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run build

      - name: Unit + BDD tests (fails below 80% coverage)
        run: npm run test:cov

      - name: Coverage evidence (job summary)
        if: always()
        run: node scripts/coverage-summary.js >> "$GITHUB_STEP_SUMMARY"

      - name: E2E tests
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/

      - name: SonarQube scan + quality gate
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  # ── Image build: only after the quality gate, only on protected branches ───
  docker:
    name: Build & Push Image
    needs: build-and-test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=ref,event=branch

      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Deploy: homolog automatic, production gated by manual approval ────────
  deploy:
    name: Deploy (${{ github.ref_name }})
    needs: docker
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'homolog' }}
    env:
      CLUSTER: ${{ github.ref_name == 'main' && 'auto-repair-prod' || 'auto-repair-homolog' }}
      ENV: ${{ github.ref_name == 'main' && 'prod' || 'homolog' }}
      DATABASE_HOST: ${{ vars.DATABASE_HOST }}
      IMAGE: ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name $CLUSTER --region $AWS_REGION

      # Manifests live in k8s/; ${ACCOUNT_ID} ${ENV} ${DATABASE_HOST} ${IMAGE} are filled here.
      - name: Apply config (ServiceAccount, ConfigMaps, Service)
        run: |
          export ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          envsubst '${ACCOUNT_ID} ${ENV} ${DATABASE_HOST} ${IMAGE}' < k8s/00-config.yaml | kubectl apply -f -

      - name: Run database migrations
        run: |
          kubectl delete pod os-migrate --ignore-not-found
          kubectl run os-migrate --image=$IMAGE --restart=Never --rm -i \
            --overrides='{"spec":{"containers":[{"name":"os-migrate","image":"'"$IMAGE"'","command":["npm","run","migration:run:prod"],"envFrom":[{"configMapRef":{"name":"api-config"}},{"secretRef":{"name":"api-secrets"}}]}]}}'

      - name: Roll out (Deployment + HPA)
        run: |
          export ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          envsubst '${ACCOUNT_ID} ${ENV} ${DATABASE_HOST} ${IMAGE}' < k8s/10-deployment.yaml | kubectl apply -f -
          kubectl rollout status deployment/$DEPLOYMENT --timeout=180s

      - name: Smoke test
        run: |
          kubectl run os-smoke --rm -i --restart=Never --image=curlimages/curl -- \
            curl -fsS http://auto-repair-api/health
