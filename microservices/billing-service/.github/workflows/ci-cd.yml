name: CI/CD - Billing Service

on:
  push:
    branches: [main, homolog]
  pull_request:
    branches: [main, homolog]

permissions:
  contents: read
  packages: write
  id-token: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  AWS_REGION: us-east-1
  DEPLOYMENT: billing-service

jobs:
  # ── Quality gate (required check on protected main) ──────────────────────
  build-and-test:
    name: Build, Test & Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Sonar needs full history for new-code detection

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run build

      - name: Unit tests (fails below 80% coverage)
        run: npm run test:cov

      - name: Coverage evidence (job summary + artifact)
        if: always()
        run: node scripts/coverage-summary.js >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/

      - name: SonarQube scan + quality gate
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  docker:
    name: Build & Push Image
    needs: build-and-test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=ref,event=branch
      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy (${{ github.ref_name }})
    needs: docker
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # homolog: automatic · production: manual approval on the GitHub Environment
    environment: ${{ github.ref_name == 'main' && 'production' || 'homolog' }}
    env:
      CLUSTER: ${{ github.ref_name == 'main' && 'auto-repair-prod' || 'auto-repair-homolog' }}
      ENV: ${{ github.ref_name == 'main' && 'prod' || 'homolog' }}
      API_HOST: ${{ vars.API_HOST }}
      IMAGE: ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - run: aws eks update-kubeconfig --name $CLUSTER --region $AWS_REGION

      # Manifests live in k8s/; ${ACCOUNT_ID} ${ENV} ${API_HOST} ${IMAGE} are filled here.
      - name: Apply config (ServiceAccount, ConfigMap, ExternalSecret, Service)
        run: |
          export ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          envsubst '${ACCOUNT_ID} ${ENV} ${API_HOST} ${IMAGE}' < k8s/00-config.yaml | kubectl apply -f -
          kubectl wait --for=condition=Ready externalsecret/billing-service-secrets --timeout=120s

      - name: Run database migrations
        run: |
          kubectl delete pod billing-migrate --ignore-not-found
          kubectl run billing-migrate --image=$IMAGE --restart=Never --rm -i \
            --overrides='{"spec":{"containers":[{"name":"billing-migrate","image":"'"$IMAGE"'","command":["npm","run","migration:run"],"envFrom":[{"secretRef":{"name":"billing-service-secrets"}}]}]}}'

      - name: Roll out (Deployment + HPA)
        run: |
          export ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          envsubst '${ACCOUNT_ID} ${ENV} ${API_HOST} ${IMAGE}' < k8s/10-deployment.yaml | kubectl apply -f -
          kubectl rollout status deployment/$DEPLOYMENT --timeout=180s

      - name: Smoke test
        run: |
          kubectl run billing-smoke --rm -i --restart=Never --image=curlimages/curl -- \
            curl -fsS http://billing-service/health
