apiVersion: apps/v1
kind: Deployment
metadata:
  name: auto-repair-api
  labels:
    app: auto-repair-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auto-repair-api
  template:
    metadata:
      labels:
        app: auto-repair-api
    spec:
      containers:
        - name: api
          # image: ghcr.io/soat-fiap-rferrazrodrigues/auto-repair-shop-api:latest
          image: auto-repair-shop-api:local
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: api-config
            - secretRef:
                name: api-secrets
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /api/docs
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/docs
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
