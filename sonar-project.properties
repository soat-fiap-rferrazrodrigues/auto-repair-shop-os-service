sonar.projectKey=auto-repair-os-service
sonar.projectName=Auto Repair OS Service
sonar.projectVersion=0.0.1
sonar.host.url=http://localhost:9000
sonar.login=
sonar.sources=src
sonar.tests=src,test
sonar.test.inclusions=**/*.spec.ts,**/*.e2e-spec.ts
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/*.spec.ts,**/*.e2e-spec.ts
sonar.coverage.exclusions=**/*.module.ts,**/*.dto.ts,**/dto/**,**/*.entity.ts,**/entities/**,**/strategies/**,**/main.ts

sonar.typescript.lcov.reportPaths=coverage/lcov.info
sonar.javascript.lcov.reportPaths=coverage/lcov.info

sonar.sourceEncoding=UTF-8
